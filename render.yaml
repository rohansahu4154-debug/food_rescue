services:
  - type: web
    name: food-rescue-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://food-rescue-oa5nk96r1-rohan-f090.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: AUTO_INITIALIZE_DATABASE
        value: "false"
